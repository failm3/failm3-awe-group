<!doctype html>
<html><head><meta charset="utf-8"><title>render_dashboard capability probe</title>
<style>
  html,body{margin:0;padding:0;width:1280px;height:720px;background:#0b1220;color:#eaf2ff;
    font-family:system-ui,-apple-system,"DejaVu Sans",sans-serif;}
  .wrap{box-sizing:border-box;width:1280px;height:720px;padding:40px;display:flex;flex-direction:column;justify-content:center;}
  h1{margin:0 0 8px;font-size:52px;letter-spacing:-1px;}
  .sub{font-size:24px;color:#8fb3d9;margin-bottom:32px;}
  .row{display:flex;gap:24px;}
  .card{flex:1;background:#16233a;border:1px solid #2b4060;border-radius:14px;padding:24px;}
  .k{font-size:15px;text-transform:uppercase;letter-spacing:2px;color:#7f9fc4;}
  .v{font-size:40px;font-weight:700;margin-top:6px;color:#5ee6a8;}
  .bar{height:22px;background:#1d2c44;border-radius:11px;margin-top:28px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:78.5%;background:linear-gradient(90deg,#3fa9f5,#5ee6a8);}
</style></head>
<body><div class="wrap">
  <h1>render_dashboard probe</h1>
  <div class="sub">Chromium 1280x720 PNG verification &mdash; legibility + geometry</div>
  <div class="row">
    <div class="card"><div class="k">Pixel grid</div><div class="v">1280&times;720</div></div>
    <div class="card"><div class="k">Progress</div><div class="v">78.50%</div></div>
    <div class="card"><div class="k">Status</div><div class="v">READY</div></div>
  </div>
  <div class="bar"><i></i></div>
</div></body></html>
