<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWE GROUP — Browser Automation Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 48px 64px;
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5em;
      margin: 0 0 16px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 1.2em;
      opacity: 0.85;
      margin-bottom: 32px;
    }
    .capabilities {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .badge {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 0.95em;
      font-weight: 500;
    }
    .timestamp {
      margin-top: 32px;
      font-size: 0.85em;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AWE GROUP</h1>
    <div class="subtitle">Browser Automation Test — NIVICT Product Design</div>
    <div class="capabilities">
      <span class="badge">Product Design</span>
      <span class="badge">AI Agent Engineering</span>
      <span class="badge">Browser Screenshot</span>
      <span class="badge">Playwright MCP</span>
    </div>
    <div class="timestamp">Generated by AWE GROUP autonomous mission</div>
  </div>
</body>
</html>
